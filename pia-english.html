<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Pía's English Game</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-column "cancha" — sticky scoreboard on top, one screen (jugada) at a time, big tap targets for phone */
:root{
  --bg:#edf1f7; --surface:#ffffff; --surface-2:#f5f7fb; --ink:#15213b; --muted:#56627a; --line:#d5dce8;
  --ball:#e2611b; --ball-ink:#b9480b; --ball-soft:#fde7d8; --navy:#15213b; --navy-ink:#ffffff;
  --good:#18864a; --good-soft:#dcf3e5; --bad:#c93838; --bad-soft:#fbe1e1; --tip:#fff4c2; --tip-ink:#5a4600;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1322; --surface:#151f36; --surface-2:#1b2742; --ink:#edf1fa; --muted:#a2aec6; --line:#2a3757;
  --ball:#ff8740; --ball-ink:#ffa46e; --ball-soft:#3a2416; --navy:#060b16; --navy-ink:#edf1fa;
  --good:#43d083; --good-soft:#123323; --bad:#ff7a7a; --bad-soft:#3a1717; --tip:#3a3410; --tip-ink:#ffe680; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1322; --surface:#151f36; --surface-2:#1b2742; --ink:#edf1fa; --muted:#a2aec6; --line:#2a3757;
  --ball:#ff8740; --ball-ink:#ffa46e; --ball-soft:#3a2416; --navy:#060b16; --navy-ink:#edf1fa;
  --good:#43d083; --good-soft:#123323; --bad:#ff7a7a; --bad-soft:#3a1717; --tip:#3a3410; --tip-ink:#ffe680; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;font-weight:500}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.1;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ball);outline-offset:2px}

/* Marcador */
.board{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--navy-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.board-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px}
.board .who{font-family:var(--f-display);font-size:18px;letter-spacing:.04em;flex:1;min-width:0}
.board .who small{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7;font-weight:800}
.score{font-family:var(--f-display);font-size:30px;background:#000;color:#ffb347;border-radius:8px;padding:2px 12px;min-width:72px;text-align:center;font-variant-numeric:tabular-nums;border:2px solid #2b3550}
.score small{display:block;font-family:var(--f-body);font-size:9px;letter-spacing:.14em;color:#c6cde0;font-weight:800;margin-top:-4px}
.score.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18)}}
.dots{max-width:680px;margin:8px auto 0;display:flex;gap:6px}
.dot{flex:1;height:30px;border-radius:6px;border:0;background:#24304d;color:#c6cde0;font-size:12px;font-weight:800}
.dot.on{background:var(--ball);color:#fff}
.dot.done{background:#2f6e4e;color:#fff}

main{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}

.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--ball-ink)}
.hero h1{font-size:clamp(34px,9vw,48px);color:var(--ink)}
.hero p{color:var(--muted);margin-top:8px}
.lead{font-size:18px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:22px}
.card ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.big{font-family:var(--f-display);font-size:22px;color:var(--ball-ink)}
.ex{background:var(--surface-2);border-left:4px solid var(--ball);border-radius:6px;padding:10px 12px;font-style:italic}
.tip{background:var(--tip);color:var(--tip-ink);border-radius:12px;padding:12px 14px;display:block}
.tip>b:first-of-type{font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.02em;display:block;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>div{background:var(--surface-2);border-radius:10px;padding:10px;min-width:0}
.grid2 b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--ball-soft);color:var(--ink);border-radius:999px;padding:3px 10px;font-weight:700;font-size:15px}
.ref{font-family:ui-monospace,Menlo,monospace;font-size:14px;background:var(--surface-2);border-radius:8px;padding:10px;overflow-x:auto}

.menu{display:flex;flex-direction:column;gap:10px}
.play{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.play .n{width:44px;height:44px;flex:none;border-radius:50%;background:var(--ball);color:#fff;font-family:var(--f-display);font-size:22px;display:grid;place-items:center;
  background-image:linear-gradient(transparent 47%,rgba(0,0,0,.35) 47% 53%,transparent 53%),linear-gradient(90deg,transparent 47%,rgba(0,0,0,.35) 47% 53%,transparent 53%)}
.play .t{flex:1;min-width:0}
.play .t b{display:block;font-size:18px}
.play .t span{color:var(--muted);font-size:14px}
.play.final{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.play.final .t span{color:#c6cde0}
.play .ok{color:var(--good);font-weight:800;font-size:14px}

.section-h{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.section-h h2{font-size:26px}
.section-h span{color:var(--muted);font-size:14px}

/* Preguntas */
.q{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.q .qt{font-weight:800;font-size:18px}
.q .qn{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--surface-2);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700;min-height:48px}
.opt.sel{border-color:var(--ball);background:var(--ball-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.slots{display:flex;flex-direction:column;gap:6px;min-height:20px}
.slot{display:flex;gap:10px;align-items:center;background:var(--ball-soft);border-radius:10px;padding:8px 12px;font-weight:700;border:0;text-align:left}
.slot i{font-style:normal;font-family:var(--f-display);color:var(--ball-ink);font-size:18px;width:20px}
.hint{font-size:14px;color:var(--muted)}
.sortrow{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:12px;background:var(--surface-2);border:2px solid transparent}
.sortrow.right{border-color:var(--good)}
.sortrow.wrong{border-color:var(--bad)}
.sortrow .it{font-weight:800}
.bk{display:flex;flex-wrap:wrap;gap:6px}
.bk button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px;min-height:40px}
.bk button.sel{background:var(--ball);border-color:var(--ball);color:#fff}
input.fill{font:inherit;font-size:18px;font-weight:700;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);width:100%}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:800;font-size:17px;background:var(--ball);color:#fff;min-height:50px}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.btn.navy{background:var(--navy);color:var(--navy-ink)}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 160px}
.fb{border-radius:12px;padding:12px 14px;font-weight:600}
.fb b{font-family:var(--f-display);font-weight:400;font-size:20px;display:block}
.fb.good{background:var(--good-soft);color:var(--ink)}
.fb.good b{color:var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--ink)}
.fb.bad b{color:var(--bad)}
.q.is-right{border-color:var(--good)}
.q.is-wrong{border-color:var(--bad)}

.progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.progress div{height:100%;background:var(--ball);transition:width .3s}
.result-big{font-family:var(--f-display);font-size:64px;line-height:1;color:var(--ball-ink);font-variant-numeric:tabular-nums}
.miss{border-left:4px solid var(--bad);padding:8px 12px;background:var(--surface-2);border-radius:6px;display:flex;flex-direction:column;gap:4px}
.miss .ans{color:var(--good);font-weight:800}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* --- Ilustraciones de Ciencias --- */
:root{--skin:#f7d2b5; --skin-line:#d9a882; --lung:#f4a6b4; --heart:#d8323a; --art:#d8323a; --vein:#2f6fd6; --trach:#bcd7f2; --pale:#f0f4fa;
  --st1:#2a8fc4; --st2:#5aa935; --st3:#ec7f2d; --st4:#6b3fa0; --fv:#4fa64a; --cer:#f2a33a; --leg:#d9534f; --ani:#b8322f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--skin:#d9b08f; --skin-line:#a77a57; --pale:#1e2a46; --trach:#7aa6d6}}
:root[data-theme="dark"]{--skin:#d9b08f; --skin-line:#a77a57; --pale:#1e2a46; --trach:#7aa6d6}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center}
.fig svg{width:100%;height:auto;max-width:420px;display:block}
.fig figcaption,.fig .cap{font-size:14px;color:var(--muted);text-align:center}
svg .skin{fill:var(--skin);stroke:var(--skin-line);stroke-width:2}
svg .lung{fill:var(--lung);stroke:#c0607a;stroke-width:1.5}
svg .heart{fill:var(--heart)}
svg .art{stroke:var(--art);fill:none;stroke-width:3;stroke-linecap:round}
svg .vein{stroke:var(--vein);fill:none;stroke-width:3;stroke-linecap:round}
svg .trach{fill:var(--trach);stroke:#6f93b8;stroke-width:1.5}
svg .lbl{fill:var(--ink);font:800 15px var(--f-body)}
svg .lbl-s{fill:var(--muted);font:700 12px var(--f-body)}
svg .lead{stroke:var(--muted);stroke-width:1.5;fill:none}
svg .ink{fill:var(--ink)}
svg .air-in{fill:var(--st1);font:800 12px var(--f-body)}
svg .air-out{fill:var(--muted);font:800 12px var(--f-body)}
svg .pulse{fill:var(--ball)}
svg .pulse-ring{fill:none;stroke:var(--ball);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ring 1.2s infinite}
@keyframes ring{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.8);opacity:0}}
svg .ecg{fill:none;stroke:var(--heart);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
svg .seg1{fill:var(--st1)} svg .seg2{fill:var(--st2)} svg .seg3{fill:var(--st3)} svg .seg4{fill:var(--st4)}
svg .wht{fill:#fff;font:800 13px var(--f-body)}
svg .fv{fill:var(--fv)} svg .cer{fill:var(--cer)} svg .leg{fill:var(--leg)} svg .ani{fill:var(--ani)}
svg .plate-rim{fill:none;stroke:var(--line);stroke-width:6}
svg .emo{font-size:22px}
.calc{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--ball-soft);border-radius:12px;padding:12px}
.calc input{width:90px;font:inherit;font-size:22px;font-weight:800;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.calc output{font-family:var(--f-display);font-size:26px;color:var(--ball-ink)}
.formula{font-family:var(--f-display);font-size:30px;text-align:center;color:var(--ink);background:var(--surface-2);border-radius:12px;padding:10px}
.formula span{color:var(--ball-ink)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0}
.tile .ico{font-size:40px;line-height:1.1}
.tile b{font-size:15px}
.tile span{font-size:13px;color:var(--muted)}
.stage{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start;background:var(--surface-2);border-radius:12px;padding:10px}
.stage .ico{font-size:40px;line-height:1;text-align:center}
.stage b{font-family:var(--f-display);font-weight:400;font-size:20px}
.stage ul{margin:4px 0 0;padding-left:18px;font-size:15px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-weight:700;font-size:15px}
.vs .y{background:var(--good-soft);border-radius:10px;padding:8px}
.vs .n{background:var(--bad-soft);border-radius:10px;padding:8px;text-decoration:line-through;text-decoration-color:var(--bad)}
.fix{background:var(--bad-soft);border-radius:12px;padding:12px 14px;display:block}
.fix>b:first-of-type{font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--bad);display:block;margin-bottom:4px}

.fig{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center;margin:0}
.fig svg{width:100%;height:auto;max-width:360px;display:block}
.fig figcaption{font-size:15px;color:var(--muted);text-align:center}
.say{align-self:flex-start;border:2px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 12px;font-weight:800;font-size:15px;min-height:38px}
.say.on{background:var(--ball);color:#fff;border-color:var(--ball)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-weight:700;font-size:15px}
body[data-spell="random"] .spellmodes [data-mode="random"],body[data-spell="September"] .spellmodes [data-mode="September"],body[data-spell="October"] .spellmodes [data-mode="October"],body[data-spell="November"] .spellmodes [data-mode="November"],body[data-spell="all"] .spellmodes [data-mode="all"]{background:var(--ball);border-color:var(--ball);color:#fff}
.listen{align-self:flex-start;border:0;background:var(--navy);color:var(--navy-ink);border-radius:999px;padding:10px 18px;font-weight:800;font-size:17px;min-height:46px}

</style>
</head>
<body>

<header class="board">
  <div class="board-in">
    <div class="who"><small>English Exam · 5°</small>PÍA</div>
    <div class="score" id="score">0<small>PUNTOS</small></div>
  </div>
  <nav class="dots" id="dots" aria-label="Jugadas"></nav>
</header>
<main id="app"></main>

<script>
/* ========== SPELLING WORDS ========== */
const WORDS = {
 September:[["cook","cocinar / cocinero"],["taste","sabor / probar"],["smell","oler / olor"],["pizza","pizza"],["yogurt","yogur"],["spices","especias"],["recipe","receta"],["sweet","dulce"],["fresh","fresco"],["delicious","delicioso"],["comfort","comodidad / consuelo"],["food","comida"],["culture","cultura"],["chopsticks","palillos chinos"],["fork","tenedor"],["knife","cuchillo"],["salt","sal"],["guest","invitado"],["meal","comida (platillo)"],["same","mismo / igual"],["rude","grosero"],["polite","educado / amable"],["celebration","celebración"],["compost","composta"],["reduce","reducir"]],
 October:[["biologist","biólogo"],["engineer","ingeniero"],["brush","cepillo / pincel"],["invention","invento"],["seeds","semillas"],["nature","naturaleza"],["solve","resolver"],["problem","problema"],["common","común"],["inspire","inspirar"],["efficient","eficiente"],["energy","energía"],["branch","rama"],["castle","castillo"],["collect","coleccionar / recolectar"],["finish","terminar"],["focus","concentrarse / enfoque"],["observe","observar"],["patient","paciente"],["project","proyecto"],["stream","arroyo"],["web","red / telaraña"],["give up","rendirse"],["benefit","beneficio"],["provide","proveer / dar"]],
 November:[["call","llamar / llamada"],["mail","correo"],["text message","mensaje de texto"],["technology","tecnología"],["video chat","videollamada"],["electricity","electricidad"],["communicate","comunicar"],["deliver","entregar"],["signal","señal"],["distance","distancia"],["almost","casi"],["share","compartir"],["argument","discusión"],["conversation","conversación"],["invitation","invitación"],["reply","responder"],["upset","molesto / triste"],["friendship","amistad"],["details","detalles"],["avoid","evitar"],["instead","en lugar de"],["interrupt","interrumpir"],["repeat","repetir"],["meaning","significado"],["notice","notar / aviso"]]
};
const ALLW = Object.values(WORDS).flat();
const spellQ = ([w,es]) => ({type:"fill", say:w, q:`🐝 Listen and spell the word. It means: “${es}” · starts with “${w[0]}” · ${w.replace(/ /g,"").length} letters${w.includes(" ")?" (2 words)":""}`, accept:[w], answer:w, why:`${w} = ${es}`});
function shuf(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const pickWords = n => shuf(ALLW).slice(0,n).map(spellQ);

/* ========== DIBUJOS ========== */
const SVG_PAST = `<svg viewBox="0 0 340 130" role="img" aria-label="Línea del tiempo: una acción larga interrumpida por una acción corta">
  <path d="M10 70 H330" stroke="var(--muted)" stroke-width="2"/>
  <text class="lbl-s" x="10" y="122">past →</text>
  <rect x="30" y="56" width="280" height="28" rx="14" fill="#2a8fc4"/>
  <text x="170" y="75" text-anchor="middle" style="fill:#fff;font:800 14px var(--f-body)">I was washing dishes…</text>
  <path d="M206 8 L190 40 H204 L194 66 L222 30 H208 L218 8 Z" fill="#d8323a"/>
  <text class="lbl" x="228" y="28" style="font-size:13px;fill:#d8323a">…he called!</text>
  <text class="lbl-s" x="170" y="104" text-anchor="middle">azul = past continuous (larga) · rojo = simple past (corta)</text>
</svg>`;

/* ========== CONTENIDO ========== */
const TOPICS = [
{ id:1, name:"Nouns and Verbs", pages:"Trailblazer p. 5", time:"5 min",
  learn:`
  <div class="grid2">
    <div><b>🧸 Noun</b>A <b>person, animal, place, thing</b> or <b>idea</b>.<br><i>Sustantivo: cook, pizza, Marco, kitchen, friendship</i></div>
    <div><b>🏃 Verb</b>An <b>action</b> or a <b>state</b>.<br><i>Verbo: cook, eat, smell, run, is</i></div>
  </div>
  <div class="card">
    <h3>Some words can be BOTH!</h3>
    <p class="ex">The <b>cook</b> (noun) will <b>cook</b> (verb) a special meal tonight.</p>
    <p class="ex"><b>Smell</b> (verb) the milk. It has a bad <b>smell</b> (noun).</p>
    <div class="chips"><span class="chip">cook</span><span class="chip">smell</span><span class="chip">taste</span><span class="chip">call</span><span class="chip">reply</span><span class="chip">brush</span><span class="chip">notice</span><span class="chip">mail</span></div>
  </div>
  <div class="tip"><b>Truco de cancha</b>Si antes hay <b>the, a, my, his</b> → es <b>noun</b>. Si antes hay <b>to, I, they, can, can't</b> → es <b>verb</b>.</div>
  <div class="card">
    <h3>Reading strategy: Visualize 👀👂👅👃✋</h3>
    <p>When you <b>visualize</b>, you make <b>pictures in your mind</b> as you read. Think about what you <b>see, hear, taste, smell and feel</b>.</p>
    <p class="hint">Ej. Marco en la pizzería: <b>hear</b> the doorbell · <b>feel</b> the heat · <b>see</b> the pizza · <b>smell</b> tomatoes and herbs.</p>
  </div>`,
  practice:[
    {type:"sort", q:"Noun or verb? (look at the word in CAPITALS)", buckets:["Noun","Verb"],
      items:[["The COOK is making a special recipe.",0],["My parents like to COOK Greek food.",1],["The milk has a bad SMELL.",0],["I have a cold, so I can't SMELL anything.",1]],
      why:"the/a + palabra = noun · to/can't + palabra = verb."},

/* ========== ESCUCHAR EN INGLÉS ========== */
let EN_VOICE=null;
function pickEN(){ try{ const v=speechSynthesis.getVoices(); EN_VOICE=v.find(x=>/en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null; }catch(e){} }
try{ pickEN(); speechSynthesis.onvoiceschanged=pickEN; }catch(e){}
function sayEN(word){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(word); u.lang="en-US"; u.rate=0.8; if(EN_VOICE) u.voice=EN_VOICE; speechSynthesis.speak(u); }catch(e){} }

/* ========== MODO DE SPELLING ========== */
let SPELL_MODE="random";
function spellSet(){ if(SPELL_MODE==="random") return pickWords(10); const src=SPELL_MODE==="all"?ALLW:WORDS[SPELL_MODE]; return shuf(src).map(spellQ); }
document.body.dataset.spell=SPELL_MODE;
document.addEventListener("click",e=>{ const b=e.target.closest(".spellmodes button"); if(!b) return;
  SPELL_MODE=b.dataset.mode; document.body.dataset.spell=SPELL_MODE; render();
  setTimeout(()=>{ const hs=document.querySelectorAll(".section-h"); const t=hs[hs.length-1]; if(t) t.scrollIntoView({behavior:"smooth",block:"start"}); },60); });

const S = {screen:"home", pts:0, earned:new Set(), done:new Set(), quiz:null, best:null};
try{ const d=JSON.parse(localStorage.getItem("pia-english")||"{}"); if(d.done) S.done=new Set(d.done); if(d.best!=null) S.best=d.best; }catch(e){}
function save(){ try{ localStorage.setItem("pia-english", JSON.stringify({done:[...S.done], best:S.best})); }catch(e){} }

const $app=document.getElementById("app"), $score=document.getElementById("score"), $dots=document.getElementById("dots");
function h(tag, attrs={}, ...kids){ const e=document.createElement(tag); for(const[k,v] of Object.entries(attrs)){ if(k==="class") e.className=v; else if(k==="html") e.innerHTML=v; else if(k.startsWith("on")) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v);} for(const c of kids.flat()){ if(c==null) continue; e.append(c.nodeType?c:document.createTextNode(c)); } return e; }
const shuffle=a=>{a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;};
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-zñ ]/g,"").replace(/\s+/g," ").trim();

function addPts(n){ S.pts+=n; $score.firstChild.nodeValue=S.pts; $score.classList.remove("bump"); void $score.offsetWidth; $score.classList.add("bump"); }

const GOOD=["¡Canasta!","¡Swish! Ni tocó el aro","¡Buen tiro!","¡Así se juega!","¡Encestaste!"];
const BAD=["Rebotó en el aro","Casi, casi","Tiro fallado, ¡a la siguiente!"];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function feedback(ok, why, pts){
  return h("div",{class:"fb "+(ok?"good":"bad"), role:"status"}, h("b",{}, ok?pick(GOOD)+(pts?`  +${pts}`:""):pick(BAD)), why);
}

/* ========== MOTOR DE PREGUNTAS ========== */
function renderQ0(q, label, onResult){
  const box=h("div",{class:"q"});
  if(label) box.append(h("div",{class:"qn"},label));
  box.append(h("div",{class:"qt"},q.q));
  const finish=(ok, extra)=>{ box.classList.add(ok?"is-right":"is-wrong"); const pts=onResult(ok); box.append(feedback(ok, (extra?extra+" ":"")+(q.why||""), pts)); };

  if(q.type==="mc"){
    const opts=h("div",{class:"opts"});
    const items=shuffle(q.options.map((t,i)=>({t,ok:i===0})));
    items.forEach(it=>{
      const b=h("button",{class:"opt",type:"button",onclick:()=>{
        [...opts.children].forEach((c,i)=>{c.disabled=true; if(items[i].ok) c.classList.add("right");});
        if(!it.ok) b.classList.add("wrong");
        finish(it.ok);
      }}, it.t);
      opts.append(b);
    });
    box.append(opts);
  }

  if(q.type==="multi"){
    box.append(h("div",{class:"hint"},"Puedes tocar varias. Luego toca “Revisar”."));
    const opts=h("div",{class:"opts"});
    const items=shuffle([...q.right.map(t=>({t,ok:true})),...q.wrong.map(t=>({t,ok:false}))]);
    const sel=new Set();
    items.forEach((it,i)=>{ const b=h("button",{class:"opt",type:"button","aria-pressed":"false",onclick:()=>{ if(sel.has(i)){sel.delete(i);b.classList.remove("sel");b.setAttribute("aria-pressed","false");} else {sel.add(i);b.classList.add("sel");b.setAttribute("aria-pressed","true");} }}, it.t); opts.append(b); });
    const chk=h("button",{class:"btn",type:"button",onclick:()=>{
      chk.disabled=true; let ok=true;
      items.forEach((it,i)=>{ const b=opts.children[i]; b.disabled=true; b.classList.remove("sel");
        if(it.ok&&sel.has(i)) b.classList.add("right"); else if(it.ok){b.classList.add("right"); ok=false;} else if(sel.has(i)){b.classList.add("wrong"); ok=false;} });
      finish(ok, ok?"":"Las verdes son las correctas.");
    }},"Revisar");
    box.append(opts, chk);
  }

  if(q.type==="order"){
    box.append(h("div",{class:"hint"},"Toca en el orden correcto. Si te equivocas, toca un paso de arriba para quitarlo."));
    const slots=h("div",{class:"slots"}), pool=h("div",{class:"opts"});
    const items=shuffle(q.items); const chosen=[];
    const chk=h("button",{class:"btn",type:"button",disabled:"",onclick:()=>{
      chk.disabled=true; [...pool.children].forEach(b=>b.disabled=true);
      const ok=chosen.every((t,i)=>t===q.items[i]);
      [...slots.children].forEach((s,i)=>{ s.disabled=true; s.style.background=`var(${chosen[i]===q.items[i]?"--good-soft":"--bad-soft"})`; });
      finish(ok, ok?"":"Orden correcto: "+q.items.join(" → ")+".");
    }},"Revisar");
    const draw=()=>{ slots.replaceChildren(...chosen.map((t,i)=>h("button",{class:"slot",type:"button",onclick:()=>{chosen.splice(i,1); draw();}}, h("i",{},String(i+1)), t)));
      pool.replaceChildren(...items.filter(t=>!chosen.includes(t)).map(t=>h("button",{class:"opt",type:"button",onclick:()=>{chosen.push(t); draw();}},t)));
      if(chosen.length===q.items.length) chk.removeAttribute("disabled"); else chk.setAttribute("disabled",""); };
    draw(); box.append(slots,pool,chk);
  }

  if(q.type==="sort"){
    const rows=h("div",{class:"opts"}); const ans=[];
    const items=shuffle(q.items);
    const chk=h("button",{class:"btn",type:"button",disabled:"",onclick:()=>{
      chk.disabled=true; let ok=true;
      items.forEach(([t,b],i)=>{ const r=rows.children[i]; const good=ans[i]===b; if(!good) ok=false; r.classList.add(good?"right":"wrong");
        r.querySelectorAll(".bk button").forEach((x,j)=>{x.disabled=true; if(!good&&j===b){x.style.borderColor="var(--good)";}}); });
      finish(ok, ok?"":"El borde verde marca la respuesta correcta.");
    }},"Revisar");
    items.forEach(([t],i)=>{
      const bk=h("div",{class:"bk"});
      q.buckets.forEach((name,j)=>bk.append(h("button",{type:"button",onclick:(e)=>{ ans[i]=j; bk.querySelectorAll("button").forEach(x=>x.classList.remove("sel")); e.currentTarget.classList.add("sel");
        if(ans.filter(x=>x!=null).length===items.length) chk.removeAttribute("disabled"); }},name)));
      rows.append(h("div",{class:"sortrow"}, h("div",{class:"it"},t), bk));
    });
    box.append(rows,chk);
  }

  if(q.type==="fill"){
    const id="f"+Math.random().toString(36).slice(2,8);
    const inp=h("input",{class:"fill",id,type:"text",autocomplete:"off",autocapitalize:"off",spellcheck:"false",placeholder:"Escribe tu respuesta","aria-label":"Tu respuesta"});
    const go=()=>{ if(!inp.value.trim()) return; inp.disabled=true; chk.disabled=true;
      const ok=q.accept.some(a=>norm(a)===norm(inp.value)); inp.style.borderColor=`var(${ok?"--good":"--bad"})`;
      finish(ok, ok?"":`La respuesta es: “${q.answer}”.`); };
    const chk=h("button",{class:"btn",type:"button",onclick:go},"Revisar");
    inp.addEventListener("keydown",e=>{if(e.key==="Enter") go();});
    box.append(inp,chk);
  }
  return box;
}

function renderQ(q,label,onResult){

  if(q.say){ const b=h("button",{class:"listen",type:"button"},"🔊 Listen"); b.addEventListener("click",()=>sayEN(q.say)); box.querySelector(".qt").after(b); }
  return box;
}

                 :h("button",{class:"btn navy",type:"button",onclick:()=>{S.done.add(id);save();go("quiz");}},"¡Al partido final! →");
  return [
    h("section",{class:"hero"}, h("div",{class:"eyebrow"},`Jugada ${id} de 5 · ${t.pages}`), h("h1",{},t.name)),
    h("div",{html:t.learn, style:"display:flex;flex-direction:column;gap:14px"}),
    h("div",{class:"section-h"},h("h2",{},"Calentamiento"),h("span",{},"+2 por canasta")),
    prac,
    h("div",{class:"row"}, h("button",{class:"btn alt",type:"button",onclick:()=>go("home")},"← Menú"), next)
  ];
}

function quiz(){
  if(!S.quiz) S.quiz={i:0, pts:0, max:QUIZ.reduce((a,q)=>a+(q.triple?3:2),0), correct:0, misses:[], answered:false};
  const Z=S.quiz, q=QUIZ[Z.i];
  const pb=h("div",{class:"progress"},h("div",{style:`width:${(Z.i/QUIZ.length)*100}%`}));
  const nextBtn=h("button",{class:"btn",type:"button",disabled:"",onclick:()=>{ Z.i++; Z.answered=false; if(Z.i>=QUIZ.length){S.screen="results";} render(); window.scrollTo({top:0}); }}, Z.i===QUIZ.length-1?"Ver mi resultado →":"Siguiente pregunta →");
  const card=renderQ(q, `Pregunta ${Z.i+1} de ${QUIZ.length}${q.triple?" · vale 3":""}`, ok=>{
    Z.answered=true; nextBtn.removeAttribute("disabled");
    if(ok){ const p=q.triple?3:2; Z.pts+=p; Z.correct++; addPts(p); return p; }
    Z.misses.push(q); return 0;
  });
  return [
    h("section",{class:"hero"}, h("div",{class:"eyebrow"},"Partido final"), h("h1",{},"La pruebita"),
      h("p",{},`Marcador del partido: ${Z.pts} de ${Z.max} puntos`)),
    pb, card, nextBtn
  ];
}

function results(){
  const Z=S.quiz; const cal=Math.round((Z.pts/Z.max)*100)/10;
  const calTxt=cal.toFixed(1).replace(".0","");
  if(S.best==null||cal>S.best){S.best=Number(calTxt);save();}
  const msg= cal>=9?"¡Eres la MVP del partido! Vas lista para el examen.":
             cal>=7?"¡Muy buen partido! Repasa las que fallaste y quedas lista.":
                    "Buen esfuerzo. Repasa las jugadas de abajo y vuelve a jugar el partido.";
  const missTopics=[...new Set(Z.misses.map(q=>q.t))];
  const ansOf=q=>q.type==="mc"?q.options[0]:q.type==="order"?q.items.join(" → "):q.type==="fill"?q.answer:q.items.map(([t,b])=>`${q.buckets[b]}: ${t.toLowerCase()}`).join(" · ");
  return [
    h("section",{class:"hero"}, h("div",{class:"eyebrow"},"Final del partido"), h("h1",{},"Tu resultado")),
    h("div",{class:"card"},
      h("div",{class:"result-big"},`${calTxt}`, h("span",{style:"font-size:24px;color:var(--muted)"}," / 10")),
      h("p",{},`Acertaste ${Z.correct} de ${QUIZ.length} preguntas · ${Z.pts} de ${Z.max} puntos.`),
      h("p",{class:"lead"},h("b",{},msg))),
    Z.misses.length?h("div",{class:"section-h"},h("h2",{},"Para repasar"),h("span",{},`${Z.misses.length} tiro(s) fallado(s)`)):null,
    Z.misses.map(q=>h("div",{class:"miss"}, h("div",{class:"qn hint"},`Jugada ${q.t}: ${TOPICS[q.t-1].name}`), h("b",{},q.q), h("div",{class:"ans"},"✓ "+ansOf(q)), h("div",{},q.why))),
    missTopics.length?h("div",{class:"row"}, missTopics.map(t=>h("button",{class:"btn alt",type:"button",onclick:()=>go(t)},`Repasar: ${TOPICS[t-1].name}`))):null,
    h("div",{class:"row"}, h("button",{class:"btn",type:"button",onclick:()=>go("quiz")},"Jugar otra vez"), h("button",{class:"btn alt",type:"button",onclick:()=>go("home")},"Menú"))
  ];
}

function render(){
  drawDots();
  const s=S.screen;
  const out= s==="home"?home(): s==="quiz"?quiz(): s==="results"?results(): topic(s);
  $app.replaceChildren(...out.flat().filter(Boolean));
}
render();
</script>
</body>
</html>
